<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css">
<style>
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.board-wrap { position: relative; width: 880px; height: 880px; }
.board {
  width: 880px; height: 880px; object-fit: cover; border-radius: 6px;
  filter: invert(1) brightness(1.1) sepia(.55) hue-rotate(95deg) saturate(1.7);
  box-shadow: 0 0 80px rgba(61,255,160,.12), inset 0 0 120px rgba(0,0,0,.6);
}
.lesion-tag {
  position: absolute; font-size: 20px; color: #ff4040; letter-spacing: .06em;
  background: rgba(4,7,10,.85); border: 1px solid rgba(255,64,64,.5);
  padding: 8px 14px; border-radius: 4px; white-space: nowrap;
  opacity: 0; transition: opacity .5s;
}
.lesion-tag.on { opacity: 1; }
.truth-card {
  position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
  text-align: center;
}
.verdict-row {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 18px;
}
.vchip {
  width: 148px; padding: 14px 10px; text-align: center; border-radius: 8px;
  background: rgba(10,18,16,.85); border: 1px solid rgba(255,64,64,.45);
}
.vchip .m { font-size: 15px; color: #9fc4b3; letter-spacing: .1em; }
.vchip .v { font-size: 26px; font-weight: 800; color: #ff4040; margin-top: 4px; }
</style></head><body>
<div class="stage">
  <div class="board-wrap" id="bw">
    <img class="board" src="../../../eval/tasks/images/boards/00041003.jpg">
    <div class="lesion-tag" id="lt" style="left:410px;top:390px">LESION 040×065 PX<br>OPEN CIRCUIT — FATAL</div>
  </div>
  <div class="verdict-row" id="vr">
    <div class="vchip"><div class="m">claude-opus</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">claude-sonnet</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">gemini-3.1</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">gpt-5.5</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">gpt-5-mini</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">grok-4.7</div><div class="v">✗</div></div>
    <div class="vchip"><div class="m">kimi-k3.1</div><div class="v">✗</div></div>
  </div>
</div>
<script src="scene.js"></script><script>
hud("FIG 1 — THE SCAN");
const vr = $("#vr"), lt = $("#lt");
vr.style.opacity = 0; vr.style.transition = "opacity .6s";
// 640px annotation -> 880px display: defect open at 335,265-374,330, center ~354,297
const S = 880 / 640;
seq(
  [400, () => sweep()],
  [3400, () => sweep()],
  [6200, () => {                       // reticle locks the lesion
    const r = $("#bw").getBoundingClientRect();
    reticleAt(r.left + 354 * S, r.top + 297 * S, 1.25);
  }],
  [7400, () => lt.classList.add("on")],
  [8600, () => stampAt(1080, 150, "GROUND TRUTH: SCRAP")],
  [11500, () => { reticleOff(); vr.style.opacity = 1; }],
  [12000, () => on(".vchip")],
  [17000, () => stampAt(820, 90, "7 / 7 WRONG", true)],
);
run();
</script></body></html>
